<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; display:flex; min-height:100vh; align-items:center; justify-content:center; margin:0; }
    .card { max-width: 420px; padding: 24px; border-radius: 16px; background: #111827; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
    h1 { margin-top: 0; }
    p { line-height: 1.5; color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="card">
    <h1>You are offline</h1>
    <p>The app shell is still available. If you already opened the main app before, go back and continue scanning attendance. Pending scans will sync automatically when the connection returns.</p>
  </div>
</body>
</html>
